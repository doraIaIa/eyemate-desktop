<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>EyeMate</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="theme-default">
    <header class="titlebar" aria-label="Thanh tiêu đề ứng dụng">
      <span class="titlebar-mark" aria-hidden="true"></span>
      <span>EyeMate</span>
      <span class="titlebar-caption">Local companion for healthier screen time</span>
    </header>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#/home" aria-label="EyeMate — Trang chủ">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 24c5-9 11-14 19-14s14 5 19 14c-5 9-11 14-19 14S10 33 5 24Z"/><circle cx="24" cy="24" r="7"/></svg>
          <span><strong>EyeMate</strong><small>visual wellbeing</small></span>
        </a>
        <nav class="primary-nav" aria-label="Điều hướng chính">
          <a href="#/home" data-route="home"><span aria-hidden="true">◉</span> Tổng quan</a>
          <a href="#/checkup" data-route="checkup"><span aria-hidden="true">◇</span> Khám mắt</a>
          <a href="#/companion" data-route="companion"><span aria-hidden="true">◷</span> Đồng hành</a>
          <a href="#/reports" data-route="reports"><span aria-hidden="true">⌁</span> Báo cáo</a>
          <a href="#/privacy" data-route="privacy"><span aria-hidden="true">⌾</span> Quyền riêng tư</a>
          <a href="#/settings" data-route="settings"><span aria-hidden="true">⚙</span> Cài đặt</a>
        </nav>
        <footer class="sidebar-footer">
          <span class="local-badge"><span aria-hidden="true">●</span> Local Only</span>
          <small>Không cần mạng · dữ liệu ở thiết bị</small>
        </footer>
      </aside>
      <main id="app-main" tabindex="-1">
        <div id="view" aria-live="polite"></div>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="assertive"></div>
    <div id="modal-root"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
