<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EyeMate</title>
    <style>
      :root { color: #172036; background: #f5f7fb; font-family: "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; }
      .layout { min-height: 100vh; display: grid; grid-template-columns: 220px 1fr; }
      nav { padding: 24px 16px; background: #172036; color: #fff; } nav h1 { font-size: 1.15rem; }
      nav button { display: block; width: 100%; border: 0; border-radius: 8px; padding: 10px; margin: 6px 0; text-align: left; color: inherit; background: transparent; cursor: pointer; }
      nav button[aria-current="page"] { background: #2856bd; }
      main { width: min(720px, calc(100% - 48px)); align-self: center; margin: 48px auto; background: #fff; border-radius: 16px; padding: 36px; box-shadow: 0 12px 40px #18213b16; }
      h2 { margin-top: 0; } .tag { color: #2856bd; font-weight: 700; } p { line-height: 1.55; } .state { color: #4b5d7b; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav aria-label="Điều hướng chính">
        <h1>EyeMate</h1>
        <button type="button" data-screen="home">Trang chủ</button>
        <button type="button" data-screen="checkup">Checkup</button>
        <button type="button" data-screen="reports">Báo cáo</button>
        <button type="button" data-screen="privacy">Quyền riêng tư</button>
        <button type="button" data-screen="settings">Cài đặt</button>
      </nav>
      <main>
        <p class="tag">EyeMate · Local Only</p>
        <h2 id="page-title">Đang tải</h2>
        <p id="page-body"></p>
        <p id="page-state" class="state" aria-live="polite"></p>
        <p id="privacy-summary" aria-live="polite"></p>
        <p>Ứng dụng không chẩn đoán, điều trị hoặc thay thế tư vấn chuyên môn.</p>
        <p id="runtime-status" aria-live="polite">Đang kiểm tra trạng thái ứng dụng…</p>
      </main>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
